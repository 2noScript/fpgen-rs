[package]
name = "fpgen-rs"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust port of fpgen (scrapfly/fingerprint-generator & JWriter20/fpgen-js)"
repository = "https://github.com/2noScript/fpgen-rs"
homepage = "https://github.com/2noScript/fpgen-rs"
readme = "README.md"
keywords = ["fingerprint", "browser-fingerprint", "fpgen", "bayesian-network", "anti-detect"]
categories = ["web-programming", "simulation"]

[dependencies]
dirs = "6"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
